name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # TensorFlow is deliberately excluded: the API degrades to 503 without a
        # model, which keeps CI fast while still exercising every code path
        # around inference. onnxruntime is included so the ONNX serving backend
        # is genuinely tested rather than skipped.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart numpy \
            opencv-python-headless pydicom pydantic sqlalchemy reportlab \
            onnx onnxruntime
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check api tests scripts evaluation

      - name: Run tests
        env:
          MODEL_PATH: __no_such_model__.keras
          RATE_LIMIT_ENABLED: "false"
        run: pytest --cov=api --cov=evaluation --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if credential files are tracked
        run: |
          if git ls-files --error-unmatch kaggle.json >/dev/null 2>&1; then
            echo "::error::kaggle.json is tracked in git. Remove it and rotate the key."
            exit 1
          fi
          echo "No tracked credential files."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
