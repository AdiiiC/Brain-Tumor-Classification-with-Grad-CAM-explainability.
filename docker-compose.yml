services:
  # ── Backend API ──────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=model_best.keras
      - TFLITE_PATH=brain_tumor_model.tflite
      - CALIBRATION_TEMP=${CALIBRATION_TEMP:-1.5}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - API_KEYS=${API_KEYS:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/brainscan.db}
      - OOD_STATS_PATH=/app/ood_stats.npz
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./model_best.keras:/app/model_best.keras:ro
      - ./brain_tumor_model.tflite:/app/brain_tumor_model.tflite:ro
      - brainscan-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (React) ─────────────────────────────────────────────────────
  frontend:
    build: ./website
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  # ── Federated Learning Server (optional) ─────────────────────────────────
  federated-server:
    build: .
    command: ["python", "-m", "upgrades.federated"]
    ports:
      - "8080:8080"
    profiles:
      - federated

volumes:
  brainscan-data:
